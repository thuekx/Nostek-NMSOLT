# OPTIONAL lab-only ACS overlay, NOT included in default docker compose.
# Run only after reading docs/nostek/GENIEACS-STAGING.md and setting secrets.
# UI binds to loopback for SSH-tunnel access. CWMP defaults to loopback and may
# bind one explicitly approved private host address for a bounded lab path.
services:
  app:
    networks:
      - default
      - acs_private

  mongo_acs:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - nmsolt_mongo_data:/data/db
    networks:
      - acs_private
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 30s
      timeout: 10s
      retries: 5

  genieacs-cwmp:
    build:
      context: .
      dockerfile: docker/genieacs/Dockerfile
    image: nmsolt-genieacs:1.2.16-local
    command: ["genieacs-cwmp"]
    restart: unless-stopped
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo_acs:27017/genieacs
    depends_on:
      mongo_acs: {condition: service_healthy}
    networks:
      - acs_private
    ports:
      - "${ACS_CWMP_BIND_IP:-127.0.0.1}:${ACS_CWMP_PORT:-17547}:7547"

  genieacs-nbi:
    image: nmsolt-genieacs:1.2.16-local
    command: ["genieacs-nbi"]
    restart: unless-stopped
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo_acs:27017/genieacs
    depends_on:
      mongo_acs: {condition: service_healthy}
      genieacs-cwmp: {condition: service_started}
    networks:
      - acs_private
    # Intentionally NO published NBI port (7557).

  genieacs-fs:
    image: nmsolt-genieacs:1.2.16-local
    command: ["genieacs-fs"]
    restart: unless-stopped
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo_acs:27017/genieacs
    depends_on:
      mongo_acs: {condition: service_healthy}
      genieacs-cwmp: {condition: service_started}
    networks:
      - acs_private
    # Intentionally NO published FS port (7567).

  genieacs-ui:
    image: nmsolt-genieacs:1.2.16-local
    command: ["genieacs-ui", "--ui-jwt-secret", "${GENIEACS_UI_JWT_SECRET:?set GENIEACS_UI_JWT_SECRET in local .env}"]
    restart: unless-stopped
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo_acs:27017/genieacs
    depends_on:
      mongo_acs: {condition: service_healthy}
      genieacs-nbi: {condition: service_started}
    networks:
      - acs_private
    ports:
      - "127.0.0.1:${ACS_UI_PORT:-13000}:3000"

networks:
  acs_private:
    internal: true

volumes:
  nmsolt_mongo_data:
