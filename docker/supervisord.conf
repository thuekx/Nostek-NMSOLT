; Nostek-NMSOLT — proses di container app (di-include /etc/supervisor/conf.d/).
; Menyalakan web (php-fpm + nginx) dan 3 daemon yang sama seperti install.sh:
; queue worker, scheduler, telnet proxy. Semua log diarahkan ke stdout container
; supaya terlihat di `docker compose logs app`.

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nostek-nmsolt-worker]
; General worker: default queue first, then polls when the poll pool is busy.
command=php /var/www/html/artisan queue:work redis --queue=default,%(ENV_NMSOLT_POLL_QUEUE)s --tries=1 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nostek-nmsolt-poll-worker]
; Dedicated OLT poll pool (NMS-07-B). Size with NMSOLT_POLL_WORKERS (entrypoint default 2).
command=php /var/www/html/artisan queue:work redis --queue=%(ENV_NMSOLT_POLL_QUEUE)s --tries=1 --timeout=900 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_NMSOLT_POLL_WORKERS)s
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nostek-nmsolt-scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nostek-nmsolt-telnet-proxy]
command=php /var/www/html/artisan telnet:proxy
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
